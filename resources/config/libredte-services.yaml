    # Strategies for the "billing.book.loader" worker.
    libredte\lib\Core\Package\Billing\Component\Book\Worker\Loader\Strategy\LibroVentas\ArrayLoaderStrategy: ~
    libredte\lib\Core\Package\Billing\Component\Book\Worker\Loader\Strategy\LibroCompras\ArrayLoaderStrategy: ~
    libredte\lib\Core\Package\Billing\Component\Book\Worker\Loader\Strategy\LibroBoletas\ArrayLoaderStrategy: ~
    libredte\lib\Core\Package\Billing\Component\Book\Worker\Loader\Strategy\LibroGuias\ArrayLoaderStrategy: ~
    libredte\lib\Core\Package\Billing\Component\Book\Worker\Loader\Strategy\ResumenVentasDiarias\ArrayLoaderStrategy: ~

    # Strategies for the "billing.book.builder" worker.
