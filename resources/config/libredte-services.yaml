    libredte\lib\Core\Package\Billing\Component\Document\Contract\DocumentBagManagerWorkerInterface:
        class: libredte\lib\Core\Package\Billing\Component\Document\Worker\DocumentBagManagerWorker
        lazy: true # Necessary due to circular reference with BuilderWorker.
    libredte\lib\Core\Package\Billing\Component\Document\Contract\ExamplesWorkerInterface:
        class: libredte\lib\Core\Package\Billing\Component\Document\Worker\ExamplesWorker
        arguments:
            $fixturesDir: '%libredte.lib.core.project_dir%/tests/fixtures/yaml/documentos_ok'
