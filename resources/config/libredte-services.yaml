# Optional wiring for apps using symfony/dependency-injection.
# Import it from your own services.yaml:
#
#   imports:
#       - { resource: '../vendor/libredte/libredte-lib-core/resources/config/libredte-services.yaml' }

# Import of services required by LibreDTE Lib Core.
# Paths follow the installed vendor/libredte/libredte-lib-core layout.
# Application also locates dependency configurations when run from a checkout.
imports:
  - { resource: '../../../../derafu/xml/resources/config/xml-services.yaml' }
  - { resource: '../../../../derafu/certificate/resources/config/certificate-services.yaml' }
  - { resource: '../../../../derafu/signature/resources/config/signature-services.yaml' }
  - { resource: '../../../../derafu/mail/resources/config/mail-services.yaml' }
  - { resource: '../../../../derafu/repository/resources/config/repository-services.yaml' }
  - { resource: '../../../../derafu/renderer/resources/config/renderer-pdf-services.yaml' }

# Parameter configuration.
parameters:
    app.locale.default: 'es'
    libredte.lib.core.project_dir: !php/const libredte\lib\Core\Application::LIBRARY_DIR
    derafu.repository.data_provider.config:
        normalization:
            idAttribute: codigo
            nameAttribute: glosa

# Configuration of services provided by the library.
services:

    # Default configuration for services.
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    # Feeds resources/translations into the consuming app's Translator (the
    # app must pass $resourceProviders: !tagged_iterator
    # derafu_translation.resource_provider to TranslatorFactory::create(),
    # see derafu/translation's translation-services.yaml). The tag is
    # explicit because _instanceof does not propagate across imported files.
    libredte\lib\Core\Translation\LibredteTranslationResourceProvider:
        tags: ['derafu_translation.resource_provider']

    # Package registry.
    Derafu\Backbone\Contract\PackageRegistryInterface:
        class: libredte\lib\Core\PackageRegistry
        public: true
        arguments:
            $packages:
                billing: '@libredte\lib\Core\Package\Billing\BillingPackage'
                system: '@libredte\lib\Core\Package\System\SystemPackage'

    # Packages.
    libredte\lib\Core\Package\Billing\BillingPackage: ~
    libredte\lib\Core\Package\System\SystemPackage: ~

    # Components of the "billing" package.
    libredte\lib\Core\Package\Billing\Component\Book\Contract\BookComponentInterface:
        class: libredte\lib\Core\Package\Billing\Component\Book\BookComponent
    libredte\lib\Core\Package\Billing\Component\Document\Contract\DocumentComponentInterface:
        class: libredte\lib\Core\Package\Billing\Component\Document\DocumentComponent
    libredte\lib\Core\Package\Billing\Component\Exchange\Contract\ExchangeComponentInterface:
        class: libredte\lib\Core\Package\Billing\Component\Exchange\ExchangeComponent
    libredte\lib\Core\Package\Billing\Component\Identifier\Contract\IdentifierComponentInterface:
        class: libredte\lib\Core\Package\Billing\Component\Identifier\IdentifierComponent
    libredte\lib\Core\Package\Billing\Component\Integration\Contract\IntegrationComponentInterface:
        class: libredte\lib\Core\Package\Billing\Component\Integration\IntegrationComponent
    libredte\lib\Core\Package\Billing\Component\OwnershipTransfer\Contract\OwnershipTransferComponentInterface:
        class: libredte\lib\Core\Package\Billing\Component\OwnershipTransfer\OwnershipTransferComponent
    libredte\lib\Core\Package\Billing\Component\TradingParties\Contract\TradingPartiesComponentInterface:
        class: libredte\lib\Core\Package\Billing\Component\TradingParties\TradingPartiesComponent

    # Components of the "system" package.
    libredte\lib\Core\Package\System\Component\Certificate\Contract\CertificateComponentInterface:
        class: libredte\lib\Core\Package\System\Component\Certificate\CertificateComponent
    libredte\lib\Core\Package\System\Component\Repository\Contract\RepositoryComponentInterface:
        class: libredte\lib\Core\Package\System\Component\Repository\RepositoryComponent
    libredte\lib\Core\Package\System\Component\Rendering\Contract\RenderingComponentInterface:
        class: libredte\lib\Core\Package\System\Component\Rendering\RenderingComponent

    # Workers of the "system.certificate" component.
    libredte\lib\Core\Package\System\Component\Certificate\Contract\LoaderWorkerInterface:
        class: libredte\lib\Core\Package\System\Component\Certificate\Worker\LoaderWorker

    # Workers of the "system.repository" component.
    libredte\lib\Core\Package\System\Component\Repository\Contract\CatalogWorkerInterface:
        class: libredte\lib\Core\Package\System\Component\Repository\Worker\CatalogWorker

    # Workers of the "billing.book" component.
    libredte\lib\Core\Package\Billing\Component\Book\Contract\LoaderWorkerInterface:
        class: libredte\lib\Core\Package\Billing\Component\Book\Worker\LoaderWorker
        arguments:
            $strategies: !tagged_iterator { tag: 'billing.book.loader#strategy', index_by: 'name' }
    libredte\lib\Core\Package\Billing\Component\Book\Contract\BuilderWorkerInterface:
        class: libredte\lib\Core\Package\Billing\Component\Book\Worker\BuilderWorker
        arguments:
