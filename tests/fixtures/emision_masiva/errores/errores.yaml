# Archivo CSV => excepción esperada y fragmento del mensaje.
indexe_no_soportado.csv:
  exception: NormalizerException
  message: 'IndExe'
fchref_invalida.csv:
  exception: BatchProcessorException
  message: 'Row 2: The reference document date must be in YYYY-MM-DD format.'
fchref_vacia.csv:
  exception: BatchProcessorException
  message: 'Row 2: The reference document date must be in YYYY-MM-DD format.'
chofer_incompleto.csv:
  exception: BatchProcessorException
  message: 'Row 2: Missing driver name.'
folio_repetido.csv:
  exception: BatchProcessorException
  message: 'Row 3: Document number 1 for document type 33 is duplicated in the file.'
folio_invalido.csv:
  exception: BatchProcessorException
  message: 'Row 2: The document number must be an integer greater than 0.'
fila_truncada_item.csv:
  exception: BatchProcessorException
  message: 'Row 2: Missing item price.'
fila_truncada_referencia.csv:
  exception: BatchProcessorException
  message: 'Row 2: The reference document number cannot be empty.'
cantidad_cero_con_precio.csv:
  exception: BatchProcessorException
  message: 'Row 2: The item quantity cannot be 0 when the price is not 0.'
item_sin_documento.csv:
  exception: BatchProcessorException
  message: 'Row 2: The row includes an item or a reference, but there is no previous document to attach them to.'
